# Builds web_app/ as a static export and deploys it to GitHub Pages.
# Site after the first green run: https://pregram.github.io/IOT/
#
# One-time repo setting, otherwise the deploy step fails with 403/404:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# Firmware, docs and unit-test edits never change the site, so only web_app/
# changes (or a manual run) trigger a build.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "web_app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Never run two deploys at once; a newer push cancels the older build.
concurrency:
  group: pages
  cancel-in-progress: true

# Read the repo, write the Pages deployment, and allow the OIDC token exchange
# the Pages deploy action uses.
permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    working-directory: web_app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Developed with Bun locally; CI uses plain npm with the committed lockfile.
      - name: Set up Node 20 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # build:static is plain `next build`; next.config.ts switches to a static
        # export when it sees NEXT_PUBLIC_STATIC_EXPORT=1.
        run: npm run build:static
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          # Project Pages live under /IOT/; without this every _next/* asset 404s.
          NEXT_PUBLIC_BASE_PATH: /IOT
          # Baked into the bundle so the lobby QR / join link points players at
          # Pages even when the host screen runs on http://localhost:3000.
          NEXT_PUBLIC_JOIN_URL_BASE: https://pregram.github.io/IOT/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check the build is a static export
        run: |
          if [ ! -f out/index.html ]; then
            echo "::error::out/index.html is missing - the build did not produce a static export."
            echo "next.config.ts must see NEXT_PUBLIC_STATIC_EXPORT=1 and the step must run 'build:static'."
            exit 1
          fi
          # Stops Jekyll from dropping the _next/ folder.
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web_app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
